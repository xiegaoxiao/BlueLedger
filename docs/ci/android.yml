name: Android build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      - name: Install SDK 37
        run: sdkmanager "platforms;android-37" "build-tools;37.0.0" "platform-tools"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
      - name: Run focused tests and build Release
        run: >-
          ./gradlew :app:testDebugUnitTest
          --tests 'com.blueledger.app.feature.reference.*'
          --tests 'com.blueledger.app.feature.management.CategoriesRouteUiTest'
          --tests 'com.blueledger.app.feature.management.CategoriesViewModelTest'
          --tests 'com.blueledger.app.feature.backup.RememberedFolderExportTest'
          :app:lintRelease :app:assembleRelease
          --no-daemon --console=plain
      - name: Upload reports and unsigned APK
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: blueledger-build
          if-no-files-found: warn
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/lint-results-release.*
