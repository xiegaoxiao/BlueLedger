# ── 蓝记 · Gradle 工程属性（总控独占） ──
# 本机 15.6GB 物理内存，且多代理会并发调用 gradlew（同一工程共享一个 Gradle daemon，
# 构建会排队而不是并行），因此堆上限按实际工程规模收紧，避免换页抖动。
org.gradle.jvmargs=-Xmx2g -Xms512m -XX:MaxMetaspaceSize=768m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8 -XX:+UseG1GC
org.gradle.parallel=true
org.gradle.workers.max=2
# 构建缓存关闭：多代理共享同一个 app/build 目录时，一个构建打包缓存条目的同时
# 另一个构建会改写 classpath-snapshot 等中间产物，导致
# "Could not get file mode for 'shrunk-classpath-snapshot.bin'" 这类缓存写入失败
# （编译本身是成功的，失败只发生在存缓存那一步）。共享工作区里确定性优先于增量提速。
org.gradle.caching=false
# 配置缓存同样关闭：多代理对同一 .gradle 目录竞争配置缓存条目。
org.gradle.configuration-cache=false
org.gradle.vfs.watch=true

android.useAndroidX=true
android.nonTransitiveRClass=true
android.nonFinalResIds=true
android.defaults.buildfeatures.resvalues=false
android.defaults.buildfeatures.shaders=false

kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx2g -Xms256m -XX:MaxMetaspaceSize=512m -XX:+UseG1GC

# 本应用为纯离线本地工具，明确关闭 Android 系统自动备份（在 AndroidManifest 中
# 设置 android:allowBackup="false"），与产品内“手动本地备份”区分。
